spring:
  application:
    name: factweek
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/factweek}
    username: ${DATABASE_USERNAME:factweek}
    password: ${DATABASE_PASSWORD:factweek}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
