services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: factweek
      POSTGRES_USER: factweek
      POSTGRES_PASSWORD: factweek
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factweek -d factweek"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - factweek-postgres:/var/lib/postgresql/data

volumes:
  factweek-postgres:
